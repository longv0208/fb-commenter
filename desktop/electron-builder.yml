appId: com.fbcommenter.desktop
productName: FB Commenter
directories:
  output: dist
files:
  - main.js
  - preload.js
  - renderer/**
extraResources:
  - from: ../backend-dist/server
    to: backend
    filter:
      - "**/*"
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
